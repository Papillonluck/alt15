const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(){
  const err = document.getElementById('err');
  err.textContent = '';
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  try{
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(D.salt), iterations:250000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.iv)}, key, b64(D.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
    setTimeout(function(){
      Array.prototype.forEach.call(document.querySelectorAll('script'), function(o){
        if(!o.textContent) return;
        var n = document.createElement('script');
        n.textContent = o.textContent;
        o.parentNode.replaceChild(n, o);
      });
    }, 60);
  }catch(e){
    err.textContent = 'Not recognised. Please check the code.';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
